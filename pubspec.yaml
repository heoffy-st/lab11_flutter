name: taskflow
description: Offline project and task manager built with Flutter and Drift.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.9.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_picker: ^10.3.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
